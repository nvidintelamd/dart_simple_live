name: app-build-action-release
# 推送 Tag 时触发
on:
  workflow_dispatch: # 允许手动触发
  push:
    tags:
      - "v*"
jobs:
  # 打包 Android
  build-android:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      # 签出代码
      - uses: actions/checkout@v6

      # APK 签名设置
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "${{ secrets.FIREBASE_JSON }}" | base64 --decode > simple_live_app/android/app/google-services.json
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode > simple_live_app/lib/firebase_options.dart
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # 设置 JAVA 环境
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            simple_live_app/android/*.gradle*
            simple_live_app/android/**/gradle-wrapper.properties

      # 设置 Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      # 更新 Flutter 的 packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 打包 APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 上传 APK 至 Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # 读取版本信息
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/app_version.json
      - name: Echo version
        run: echo "${{ fromJson(steps.version.outputs.content).version }}"
      - name: Echo version content
        run: echo "${{ fromJson(steps.version.outputs.content).version_desc }}"

      # 上传至 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      # 完成
      - run: echo "🍏 This job's status is ${{ job.status }}."

  # 打包 Linux
  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: master
      # 安装依赖
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev unzip libasound2-dev gcc g++ autoconf automake \
              debhelper glslang-dev ladspa-sdk xutils-dev libasound2-dev libarchive-dev libbluray-dev \
              libdav1d-dev libdvdnav-dev libegl1-mesa-dev libepoxy-dev libfontconfig-dev libfreetype6-dev \
              libfribidi-dev libgl1-mesa-dev libgbm-dev libgme-dev libgsm1-dev libharfbuzz-dev libjpeg-dev \
              libbrotli-dev liblcms2-dev libmodplug-dev libmp3lame-dev libopenal-dev \
              libopus-dev libopencore-amrnb-dev libopencore-amrwb-dev libpulse-dev librtmp-dev \
              libsdl2-dev libsixel-dev libssh-dev libsoxr-dev libspeex-dev libtool \
              libv4l-dev libva-dev libvdpau-dev libvorbis-dev libvo-amrwbenc-dev \
              libunwind-dev libvpx-dev libwayland-dev libx11-dev libxext-dev libdrm-dev \
              libxkbcommon-dev libxrandr-dev libxss-dev libxv-dev libxvidcore-dev \
              linux-libc-dev nasm ninja-build pkg-config python3 python3-docutils wayland-protocols \
              x11proto-core-dev zlib1g-dev libfdk-aac-dev libtheora-dev libwebp-dev \
              unixodbc-dev libpq-dev libxxhash-dev libaom-dev libbs2b-dev libcaca-dev libcdio-paranoia-dev
      # 打开 Linux Desktop 支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      # 更新 Flutter 的 packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 设置 Fastforge 环境
      - name: Install fast-forge
        run: |
          git clone https://github.com/SlotSun/fastforge.git
          cd fastforge
          dart pub global activate melos
          melos run activate
      # build Linux DEB\ZIP
      - name: Build Linux
        run: |
          cd simple_live_app
          fastforge package --platform linux --targets deb,zip --skip-clean
          cd build/dist/*
          mv simple_live_app-*-linux.deb Slive-${{ matrix.arch }}-linux.deb
          mv simple_live_app-*-linux.zip Slive-${{ matrix.arch }}-linux.zip
      # 上传 Linux 包至 Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

      # 读取版本信息
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/app_version.json
      - name: Echo version
        run: echo "${{ fromJson(steps.version.outputs.content).version }}"
      - name: Echo version content
        run: echo "${{ fromJson(steps.version.outputs.content).version_desc }}"

      # 上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip
      # 完成
      - run: echo "🍏 Linux job's status is ${{ job.status }}."

  # 打包Windows
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true
          channel: "stable"
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 设置 Fastforge 环境 和 Inno Setup
      - name: Install Fastforge and Inno Setup
        run: |
          git clone https://github.com/SlotSun/fastforge.git
          cd fastforge
          dart pub global activate melos
          melos run activate
          choco install innosetup
      # 添加中文安装引导
      - name: Add Chinese language file for Inno Setup
        run: |
          cd simple_live_app
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: powershell
      # build Windows ZIP\MSIX\EXE
      - name: Build Windows
        run: |
          cd simple_live_app
          fastforge package --platform windows --targets msix,zip,exe --skip-clean
          cd build/dist/*
          Get-ChildItem "simple_live_app-*" | ForEach-Object {
              $newName = $_.Name -replace '^simple_live_app', 'Slive'
              Rename-Item $_ -NewName $newName
          }
        shell: pwsh
      # 上传 Windows 至 Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
            simple_live_app/build/dist/*/*.exe

      # 读取版本信息
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/app_version.json
      - name: Echo version
        run: echo "${{ fromJson(steps.version.outputs.content).version }}"
      - name: Echo version content
        run: echo "${{ fromJson(steps.version.outputs.content).version_desc }}"

      # 上传至 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
            simple_live_app/build/dist/*/*.exe

      # 完成
      - run: echo "🍏 Windows job's status is ${{ job.status }}."

  # 打包 Flatpak
  build-flatpak:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4
      # 安装依赖
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder ca-certificates gnupg software-properties-common
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          git config --global protocol.file.allow always
      # 构建 Flatpak bundle
      - name: Build flatpak bundle
        run: |
          flatpak-builder build-dir flatpak/flatpak-manifest.yaml \
            --arch=${{ matrix.arch }} \
            --repo=${{ matrix.arch }} \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            --ccache \
            --disable-rofiles-fuse
          flatpak build-bundle ${{ matrix.arch }} Slive-${{ matrix.arch }}.flatpak io.github.SlotSun.Slive

      # 上传 Flatpak 包至 Artifacts
      - name: Upload linux flatpak to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-${{ matrix.arch }}
          path: Slive-*.flatpak

      # 读取版本信息
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/app_version.json
      - name: Echo version
        run: echo "${{ fromJson(steps.version.outputs.content).version }}"
      - name: Echo version content
        run: echo "${{ fromJson(steps.version.outputs.content).version_desc }}"

      # 上传至 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          token: ${{ secrets.TOKEN }}
          files: Slive-*.flatpak
      # 完成
      - run: echo "🍏 Flatpak job's status is ${{ job.status }}."

  # 打包 Windows ARM64
  build-windows-arm64:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4

      # 设置 Flutter 环境（需要 3.44+ 以支持 Windows ARM64 引擎）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          cache: true
          channel: "stable"

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 先用 x64 构建一次，生成 CMake 项目结构（generated_config.cmake 等）
      - name: Generate Flutter project structure (x64)
        run: |
          cd simple_live_app
          flutter build windows --release
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}

      # 下载 ARM64 Flutter 引擎文件（Flutter SDK 默认只含 x64 引擎）
      - name: Download ARM64 Flutter Engine
        shell: pwsh
        run: |
          $flutterRoot = $env:FLUTTER_ROOT
          Write-Host "Flutter root: $flutterRoot"
          $engineVersion = (Get-Content "$flutterRoot/bin/internal/engine.version" -Raw).Trim()
          Write-Host "Engine version: $engineVersion"
          $cacheDir = "$flutterRoot/bin/cache/artifacts/engine"
          $baseUrl = "https://storage.googleapis.com/flutter_infra_release/flutter/$engineVersion"

          $downloads = @(
            @{ url = "$baseUrl/windows-arm64-debug/windows-arm64-flutter.zip"; dir = "windows-arm64-debug" },
            @{ url = "$baseUrl/windows-arm64-profile/windows-arm64-flutter.zip"; dir = "windows-arm64-profile" },
            @{ url = "$baseUrl/windows-arm64-release/windows-arm64-flutter.zip"; dir = "windows-arm64-release" },
            @{ url = "$baseUrl/windows-arm64/flutter-cpp-client-wrapper.zip"; dir = "windows-arm64" }
          )

          foreach ($dl in $downloads) {
            $targetDir = "$cacheDir/$($dl.dir)"
            $zipFile = "$env:TEMP/$($dl.dir).zip"
            Write-Host "Downloading: $($dl.url)"
            try {
              Invoke-WebRequest -Uri $dl.url -OutFile $zipFile -UseBasicParsing
              New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
              Expand-Archive -Path $zipFile -DestinationPath $targetDir -Force
              Remove-Item $zipFile -ErrorAction SilentlyContinue
              Write-Host "OK: $($dl.dir)"
            } catch {
              Write-Host "FAILED: $($dl.dir) - $($_.Exception.Message)"
            }
          }

          # icudtl.dat 是架构无关的，从 x64 复制
          $icuSrc = "$cacheDir/windows-x64-release/icudtl.dat"
          $icuDst = "$cacheDir/windows-arm64-release/icudtl.dat"
          if ((Test-Path $icuSrc) -and !(Test-Path $icuDst)) {
            Copy-Item $icuSrc $icuDst
            Write-Host "Copied icudtl.dat to windows-arm64-release"
          }
          $icuDst2 = "$cacheDir/windows-arm64/icudtl.dat"
          if ((Test-Path $icuSrc) -and !(Test-Path $icuDst2)) {
            Copy-Item $icuSrc $icuDst2
            Write-Host "Copied icudtl.dat to windows-arm64"
          }

          Write-Host "=== ARM64 Engine DLLs ==="
          Get-ChildItem "$cacheDir/windows-arm64*" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}

      # 替换 ephemeral 目录中的 x64 DLL 为 ARM64 版本
      - name: Replace ephemeral DLLs with ARM64 versions
        shell: pwsh
        run: |
          $flutterRoot = $env:FLUTTER_ROOT
          $cacheDir = "$flutterRoot/bin/cache/artifacts/engine"
          $ephemeralDir = "simple_live_app/windows/flutter/ephemeral"

          $replacements = @(
            @{ src = "$cacheDir/windows-arm64-release/flutter_windows.dll"; dst = "$ephemeralDir/flutter_windows.dll" },
            @{ src = "$cacheDir/windows-arm64-release/flutter_windows.dll.exp"; dst = "$ephemeralDir/flutter_windows.dll.exp" },
            @{ src = "$cacheDir/windows-arm64-release/flutter_windows.dll.lib"; dst = "$ephemeralDir/flutter_windows.dll.lib" }
          )

          foreach ($r in $replacements) {
            if (Test-Path $r.src) {
              Copy-Item $r.src $r.dst -Force
              Write-Host "Replaced: $($r.dst)"
            } else {
              Write-Host "WARNING: Source not found: $($r.src)"
            }
          }
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}

      # 设置 Rust ARM64 target
      - name: Setup Rust ARM64 target
        run: |
          rustup target add aarch64-pc-windows-msvc

      # 用 CMake 直接构建 ARM64
      - name: Build Windows ARM64
        shell: pwsh
        run: |
          cd simple_live_app

          $arm64BuildDir = "build/windows-arm64"
          if (Test-Path $arm64BuildDir) { Remove-Item $arm64BuildDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $arm64BuildDir | Out-Null

          # CMake configure
          Write-Host "=== CMake configure ==="
          cmake -S windows -B $arm64BuildDir -G "Visual Studio 17 2022" -A ARM64 -DFLUTTER_TARGET_PLATFORM=windows-arm64

          # CMake build
          Write-Host "=== CMake build ==="
          cmake --build $arm64BuildDir --config Release --target install

          # 检查输出
          Write-Host "=== Build output ==="
          Get-ChildItem $arm64BuildDir -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "Found: $($_.FullName)" }

      # 打包 ZIP
      - name: Package ZIP
        shell: pwsh
        run: |
          cd simple_live_app
          $buildDir = "build/windows-arm64/runner/Release"
          if (Test-Path $buildDir) {
            $zipName = "Slive-arm64-windows.zip"
            Compress-Archive -Path "$buildDir/*" -DestinationPath "build/$zipName" -Force
            Write-Host "Created: build/$zipName"
          } else {
            Write-Host "ERROR: Build directory not found: $buildDir"
            Get-ChildItem "build/windows-arm64" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
          }

      # 上传至 Artifacts
      - name: Upload Windows ARM64 to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            simple_live_app/build/*.zip
            simple_live_app/build/windows-arm64/runner/Release/*

      # 读取版本信息
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/app_version.json
      - name: Echo version
        run: echo "${{ fromJson(steps.version.outputs.content).version }}"

      # 上传至 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_app/build/*.zip
      # 完成
      - run: echo "🍏 Windows ARM64 job's status is ${{ job.status }}."
